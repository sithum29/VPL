<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPL 2026 - Points Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a237e;
            --secondary: #ff6f00;
            --accent: #00bcd4;
            --bg: #0a0e27;
            --card: #151932;
            --text: #ffffff;
            --muted: #8b92b4;
            --border: #2a3050;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        /* Navigation */
        .navbar {
            background: rgba(10, 14, 39, 0.98);
            border-bottom: 2px solid var(--secondary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 0.25rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--secondary);
            background: rgba(255, 111, 0, 0.1);
        }

        /* Main Content */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        /* Table */
        .table-wrap {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .table-header {
            display: grid;
            grid-template-columns: 45px 1fr 60px 60px;
            gap: 0.5rem;
            padding: 1rem;
            background: rgba(255, 111, 0, 0.1);
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--secondary);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .team-row {
            display: grid;
            grid-template-columns: 45px 1fr 60px 60px;
            gap: 0.5rem;
            padding: 1rem;
            align-items: center;
            border-top: 1px solid var(--border);
            transition: background 0.2s;
        }

        .team-row:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        /* Rank styling */
        .team-row.rank-1 {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.15), transparent);
            border-left: 3px solid #ffd700;
        }

        .rank-1 .rank-num {
            color: #ffd700;
            font-size: 1.3rem;
        }

        .team-row.rank-2 {
            border-left: 3px solid #c0c0c0;
        }

        .rank-2 .rank-num {
            color: #c0c0c0;
        }

        .rank-num {
            font-size: 1.1rem;
            font-weight: 800;
            text-align: center;
            color: var(--muted);
        }

        /* Team cell */
        .team-cell {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .team-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
            background: #fff;
            flex-shrink: 0;
        }

        .team-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.1rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .team-info span {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
        }

        .badge {
            font-size: 0.6rem;
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-gold {
            background: #ffd700;
            color: #000;
        }

        .badge-silver {
            background: #c0c0c0;
            color: #000;
        }

        /* Stats */
        .stat {
            text-align: center;
            font-size: 0.9rem;
        }

        .stat-label {
            display: block;
            font-size: 0.65rem;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .points {
            color: var(--secondary);
            font-weight: 800;
            font-size: 1.1rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--muted);
            font-size: 0.8rem;
            margin-top: 2rem;
            border-top: 2px solid var(--secondary);
        }

        /* Mobile */
        @media (max-width: 480px) {
            .nav-links {
                gap: 0.1rem;
            }
            .nav-links a {
                padding: 0.4rem 0.5rem;
                font-size: 0.7rem;
            }
            .team-logo {
                width: 35px;
                height: 35px;
            }
            .team-info h3 {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">VPL</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="matches.html">Matches</a></li>
                <li><a href="stats.html">Stats</a></li>
                <li><a href="teams.html">Teams</a></li>
                <li><a href="points.html" class="active">Table</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Points Table</h1>
            <p>Season 1 - 2026</p>
        </div>

        <div class="table-wrap">
            <div class="table-header">
                <div>Pos</div>
                <div>Team</div>
                <div>NRR</div>
                <div>Pts</div>
            </div>

            <!-- EDIT ONLY DATA ATTRIBUTES BELOW -->
            <!-- Format: rank|short|name|logo|played|won|lost|tied|nrr|points -->
            
            <div class="team-row" data-team="1|RCG|Royal Challengers Galle|RCG.jpeg|4|3|1|0|924|6"></div>
            <div class="team-row" data-team="2|JS|Jaffna Sharks|JS.png|4|3|1|0|-118|6"></div>
            <div class="team-row" data-team="3|ABA|Apex Bolt Assassins|ABA.jpeg|3|2|1|0|135|4"></div>
            <div class="team-row" data-team="4|SRC|Sunrisers Colombo|SRC.jpeg|3|1|2|0|-31|2"></div>
            <div class="team-row" data-team="5|RS|Rajasthan Stallions|RS.png|4|0|4|0|-910|0"></div>
        </div>
    </div>

    <div class="footer">
        Virtual Premier League 2026<br>
        CricketXI Points System
    </div>

    <script>
        // Render rows from data attributes
        document.querySelectorAll('.team-row').forEach(row => {
            const [rank, short, name, logo, played, won, lost, tied, nrr, points] = row.dataset.team.split('|');
            
            row.classList.add(`rank-${rank}`);
            
            row.innerHTML = `
                <div class="rank-num">${rank}</div>
                <div class="team-cell">
                    <img src="${logo}" alt="${short}" class="team-logo">
                    <div class="team-info">
                        <h3>${name}${rank === '1' ? '<span class="badge badge-gold">★ Champions</span>' : rank === '2' ? '<span class="badge badge-silver">Runner-up</span>' : ''}</h3>
                        <span>${played}M • ${won}W ${lost}L ${tied}T</span>
                    </div>
                </div>
                <div class="stat">
                    <span class="stat-label">NRR</span>
                    ${parseFloat(nrr) >= 0 ? '+' : ''}${nrr}
                </div>
                <div class="stat">
                    <span class="stat-label">Pts</span>
                    <span class="points">${points}</span>
                </div>
            `;
        });
    </script>

</body>
</html>
