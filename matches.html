<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPL 2026 Season 01 - Fixtures</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #fff;
            line-height: 1.5;
        }

        /* Header */
        .header {
            background: #1a237e;
            padding: 15px;
            text-align: center;
            border-bottom: 3px solid #ffd700;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 20px;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            color: #b0b0c0;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 8px;
            padding: 15px;
            overflow-x: auto;
            background: rgba(255,255,255,0.03);
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #333;
            background: transparent;
            color: #b0b0c0;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #ff6f00;
            color: white;
            border-color: #ff6f00;
        }

        /* Match Cards */
        .container {
            padding: 0 15px 30px;
        }

        .date-group {
            margin-bottom: 25px;
        }

        .date-label {
            color: #ffd700;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-left: 5px;
            border-left: 3px solid #ffd700;
            padding-left: 10px;
        }

        .match-card {
            background: #1a1a2e;
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .match-card:active {
            transform: scale(0.98);
        }

        .match-header {
            background: rgba(26,35,126,0.5);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .match-num {
            color: #ffd700;
            font-weight: 700;
        }

        .match-status {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-upcoming { background: rgba(255,215,0,0.2); color: #ffd700; }
        .status-live { background: rgba(0,255,136,0.2); color: #00ff88; }
        .status-completed { background: rgba(107,107,139,0.2); color: #6b6b8b; }

        .match-body {
            padding: 15px;
        }

        .teams-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .team.away {
            flex-direction: row-reverse;
            text-align: right;
        }

        /* ==========================================
           TEAM LOGO STYLES - Images fit in circles
           ========================================== */
        .team-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            border: 2px solid;
            flex-shrink: 0;
            overflow: hidden; /* Keeps image inside circle */
            position: relative;
            background: rgba(255,255,255,0.1);
        }

        /* Style for logo images */
        .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Makes image cover the circle */
            object-position: center; /* Centers the image */
            display: block;
        }

        /* Fallback text styling (when no image) */
        .team-logo .initials {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 14px;
        }

        .team-info h3 {
            font-size: 14px;
            margin-bottom: 2px;
        }

        .team-info span {
            font-size: 11px;
            color: #6b6b8b;
        }

        .vs {
            color: #ffd700;
            font-weight: 800;
            font-size: 16px;
            padding: 0 15px;
        }

        /* Winner Section */
        .winner-box {
            background: rgba(255,215,0,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            margin-top: 10px;
        }

        .winner-box.completed {
            background: rgba(0,255,136,0.1);
            border-color: rgba(0,255,136,0.3);
        }

        .winner-label {
            font-size: 11px;
            color: #b0b0c0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .winner-name {
            font-size: 14px;
            font-weight: 700;
            color: #ffd700;
            margin-top: 3px;
        }

        .winner-box.completed .winner-name {
            color: #00ff88;
        }

        .match-footer {
            padding: 10px 15px;
            background: rgba(0,0,0,0.2);
            font-size: 11px;
            color: #6b6b8b;
            display: flex;
            justify-content: space-between;
        }

        /* Empty State */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #6b6b8b;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #6b6b8b;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>

        // ==========================================
        // RENDER FUNCTION
        // ==========================================
        function render(filterType = 'all') {
            const container = document.getElementById('matches');
            let html = '';
            
            let filtered = matches;
            if (filterType !== 'all') {
                filtered = matches.filter(m => m.status === filterType);
            }

            const grouped = {};
            filtered.forEach(m => {
                if (!grouped[m.date]) grouped[m.date] = [];
                grouped[m.date].push(m);
            });

            Object.keys(grouped).forEach(date => {
                html += `<div class="date-group"><div class="date-label">${date}</div>`;
                
                grouped[date].forEach(m => {
                    const t1 = teams[m.t1];
                    const t2 = teams[m.t2];
                    const winner = m.winner ? teams[m.winner] : null;
                    
                    // Logo HTML helper function
                    const getLogoHTML = (team) => {
                        if (team.logo) {
                            return `<img src="${team.logo}" alt="${team.short}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">`;
                        }
                        return '';
                    };
                    
                    html += `
                        <div class="match-card" onclick="window.location.href='m${m.id}s1.html'">

                                <span class="match-num">${m.num}</span>
                                <span class="match-status status-${m.status}">${m.status}</span>
                            </div>
                            <div class="match-body">
                                <div class="teams-row">
                                    <div class="team">
                                        <div class="team-logo" style="border-color:${t1.color};background:${t1.bg};color:${t1.color}">
                                            ${getLogoHTML(t1)}
                                            <span class="initials" style="${t1.logo ? 'display:none' : ''}">${t1.short}</span>
                                        </div>
                                        <div class="team-info">
                                            <h3>${t1.name}</h3>
                                            <span>${m.t1 === m.winner ? '👑 Winner' : ''}</span>
                                        </div>
                                    </div>
                                    <div class="vs">VS</div>
                                    <div class="team away">
                                        <div class="team-logo" style="border-color:${t2.color};background:${t2.bg};color:${t2.color}">
                                            ${getLogoHTML(t2)}
                                            <span class="initials" style="${t2.logo ? 'display:none' : ''}">${t2.short}</span>
                                        </div>
                                        <div class="team-info">
                                            <h3>${t2.name}</h3>
                                            <span>${m.t2 === m.winner ? '👑 Winner' : ''}</span>
                                        </div>
                                    </div>
                                </div>
                                ${winner ? `
                                <div class="winner-box completed">
                                    <div class="winner-label">Winner</div>
                                    <div class="winner-name">🏆 ${winner.name}</div>
                                </div>
                                ` : m.status === 'completed' ? `
                                <div class="winner-box">
                                    <div class="winner-label">Winner</div>
                                    <div class="winner-name">TBD</div>
                                </div>
                                ` : ''}

                            <div class="match-footer">
                                <span>📍 ${m.venue}</span>
                                <span>View Scorecard →</span>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            });

            if (filtered.length === 0) {
                html = '<div class="empty">No matches found</div>';
            }

            container.innerHTML = html;
        }

        function filter(type) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            render(type);
        }
